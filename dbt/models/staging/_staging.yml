version: 2
models:
  - name: stg_games
    description: Completed NFL games with closing lines, 1999 to present.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: home_margin
        tests: [not_null]
      - name: home_spread
        tests: [not_null]
      - name: total_line
        tests: [not_null]
      - name: game_type
        tests:
          - accepted_values:
              arguments:
                values: ['REG', 'WC', 'DIV', 'CON', 'SB']

name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 * * 2"   # Tuesdays, after Monday Night Football
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh data (scheduled runs only)
        if: github.event_name == 'schedule'
        run: make data
      - run: make lint
      - name: dbt build (models + data tests)
        run: make build
      - run: make analysis
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
